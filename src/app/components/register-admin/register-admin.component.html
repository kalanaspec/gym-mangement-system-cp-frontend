<div class="register-admin-container">
    <mat-card class="register-admin-card">
        <mat-card-header>
            <div class="header-icon-wrapper">
                <mat-icon>admin_panel_settings</mat-icon>
            </div>
            <mat-card-title>Register New Admin</mat-card-title>
            <mat-card-subtitle>Add a new administrator to the gym management system</mat-card-subtitle>
        </mat-card-header>
        <mat-card-content>
            <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
                <mat-form-field appearance="outline" class="full-width">
                    <mat-label>Username</mat-label>
                    <mat-icon matPrefix>person</mat-icon>
                    <input matInput formControlName="username" required autocomplete="username">
                    <mat-error *ngIf="registerForm.get('username')?.hasError('required')">
                        Username is required
                    </mat-error>
                </mat-form-field>

                <mat-form-field appearance="outline" class="full-width">
                    <mat-label>Password</mat-label>
                    <mat-icon matPrefix>lock</mat-icon>
                    <input matInput type="password" formControlName="password" required autocomplete="new-password">
                    <mat-error *ngIf="registerForm.get('password')?.hasError('required')">
                        Password is required
                    </mat-error>
                    <mat-error *ngIf="registerForm.get('password')?.hasError('minlength')">
                        Password must be at least 6 characters
                    </mat-error>
                </mat-form-field>

                <mat-form-field appearance="outline" class="full-width">
                    <mat-label>Full Name</mat-label>
                    <mat-icon matPrefix>badge</mat-icon>
                    <input matInput formControlName="name" required autocomplete="name">
                    <mat-error *ngIf="registerForm.get('name')?.hasError('required')">
                        Name is required
                    </mat-error>
                </mat-form-field>

                <mat-form-field appearance="outline" class="full-width">
                    <mat-label>Email</mat-label>
                    <mat-icon matPrefix>email</mat-icon>
                    <input matInput type="email" formControlName="email" required autocomplete="email">
                    <mat-error *ngIf="registerForm.get('email')?.hasError('required')">
                        Email is required
                    </mat-error>
                    <mat-error *ngIf="registerForm.get('email')?.hasError('email')">
                        Please enter a valid email
                    </mat-error>
                </mat-form-field>

                <button mat-raised-button type="submit" class="full-width submit-btn" [disabled]="registerForm.invalid">
                    <mat-icon>person_add</mat-icon>
                    Register Admin
                </button>
            </form>
        </mat-card-content>
    </mat-card>
</div>
