<div class="confirm-dialog">
  <div class="dialog-header">
    <div class="dialog-icon"
         [ngClass]="{
           'danger': data.type === 'danger',
           'warning': data.type === 'warning',
           'info': data.type === 'info',
           'success': data.type === 'success'
         }">
      <mat-icon>{{ data.icon }}</mat-icon>
    </div>
  </div>

  <div class="dialog-content">
    <h2 class="dialog-title">{{ data.title }}</h2>
    <p class="dialog-message">{{ data.message }}</p>
  </div>

  <div class="dialog-actions">
    <button mat-stroked-button
            class="cancel-btn"
            (click)="onCancel()"
            type="button">
      <mat-icon>close</mat-icon>
      <span>{{ data.cancelText }}</span>
    </button>
    <button mat-raised-button
            [ngClass]="{
              'danger-btn': data.type === 'danger',
              'warning-btn': data.type === 'warning',
              'info-btn': data.type === 'info',
              'success-btn': data.type === 'success'
            }"
            (click)="onConfirm()"
            type="button">
      <mat-icon>{{ data.type === 'danger' ? 'delete_forever' : 'check_circle' }}</mat-icon>
      <span>{{ data.confirmText }}</span>
    </button>
  </div>
</div>
