<div class="login-container">
    <!-- Left Side - Image (60%) -->
    <div class="image-section">
        <div class="image-overlay"></div>
    </div>

    <!-- Right Side - Login Panel (40%) -->
    <div class="form-section">
        <div class="form-wrapper">
            <!-- Logo -->
            <div class="brand-logo">
                <div class="logo-icon">
                    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M20.57 14.86L22 13.43 20.57 12 17 15.57 8.43 7 12 3.43 10.57 2 9.14 3.43 7.71 2 5.57 4.14 4.14 2.71 2.71 4.14l1.43 1.43L2 7.71l1.43 1.43L2 10.57 3.43 12 7 8.43 15.57 17 12 20.57 13.43 22l1.43-1.43L16.29 22l2.14-2.14 1.43 1.43 1.43-1.43-1.43-1.43L22 16.29z" fill="currentColor"/>
                    </svg>
                </div>
                <div class="logo-text">
                    <span class="iron">IRON</span>
                    <span class="paradise">PARADISE</span>
                </div>
            </div>

            <!-- Welcome Text -->
            <div class="welcome-text">
                <h1>Welcome Back</h1>
                <p>Sign in to continue your fitness journey</p>
            </div>

            <!-- Login Form -->
            <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form">
                <mat-form-field appearance="outline" class="full-width">
                    <mat-label>Username</mat-label>
                    <input matInput formControlName="username" required autocomplete="username">
                    <mat-icon matPrefix class="input-icon">person_outline</mat-icon>
                    <mat-error *ngIf="loginForm.get('username')?.hasError('required')">
                        Username is required
                    </mat-error>
                </mat-form-field>

                <mat-form-field appearance="outline" class="full-width">
                    <mat-label>Password</mat-label>
                    <input matInput type="password" formControlName="password" required autocomplete="current-password">
                    <mat-icon matPrefix class="input-icon">lock_outline</mat-icon>
                    <mat-error *ngIf="loginForm.get('password')?.hasError('required')">
                        Password is required
                    </mat-error>
                </mat-form-field>

                <button mat-raised-button type="submit" class="login-button" [disabled]="loginForm.invalid">
                    <span>Log In</span>
                    <mat-icon class="button-icon">arrow_forward</mat-icon>
                </button>
            </form>

            <!-- Register Link -->
            <div class="register-link">
                <p>Don't have an account? <a routerLink="/register">Create Account</a></p>
            </div>
        </div>
    </div>
</div>
